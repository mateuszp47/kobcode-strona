name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
      - run: php artisan view:cache
      - run: php artisan route:list --except-vendor
      - run: npm install --ignore-scripts && npm run build
      - name: Prepare browser checks
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Check portfolio on mobile, tablet and desktop
        env:
          APP_ENV: testing
          APP_URL: http://127.0.0.1:8001
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/kobcode-browser.sqlite
          CACHE_STORE: file
          SESSION_DRIVER: file
          SITE_INDEXABLE: 'true'
        run: |
          touch /tmp/kobcode-browser.sqlite
          php artisan migrate --force
          php artisan storage:link
          php artisan kobcode:case-studies --publish
          php artisan serve --host=127.0.0.1 --port=8001 > /tmp/kobcode-browser.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8001/realizacje > /dev/null; then break; fi
            sleep 1
          done
          node tests/browser/case-studies.mjs
      - name: Save portfolio screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-responsive-screenshots
          path: browser-results/
          if-no-files-found: ignore
